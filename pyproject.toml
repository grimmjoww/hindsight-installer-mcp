[project]
name = "hindsight-installer-mcp"
version = "0.1.0"
description = "Model Context Protocol server for installing Postgres extensions and upgrading embedding pipelines on Hindsight — works with Claude Code, Cursor, Cline, Continue, OpenAI Codex, Gemini CLI, or any MCP-compatible agent."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "grimmjoww" }]
keywords = ["mcp", "model-context-protocol", "hindsight", "postgres", "vchord", "pgvector", "agent", "agentic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]

dependencies = [
    "mcp[cli]>=1.10.0",
    "httpx>=0.27.0",
    "psutil>=5.9.0",
]

[project.scripts]
hindsight-installer-mcp = "hindsight_installer_mcp.server:main"

[project.urls]
Homepage = "https://github.com/grimmjoww/hindsight-installer-mcp"
Repository = "https://github.com/grimmjoww/hindsight-installer-mcp"
Issues = "https://github.com/grimmjoww/hindsight-installer-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hindsight_installer_mcp"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]
